# some code from https://github.com/pydantic/pydantic-core/blob/d6e7890b36ef21cb28180a7f5b1479da2319012d/.github/workflows/ci.yml
# and https://github.com/pydantic/pydantic/blob/f59e929c999e8b2efc7b12fd0bc1685c1a186be3/.github/workflows/ci.yml
# MIT License, see author list by link

name: CI

on:
  push:
    branches:
      - main
    tags:
      - "**"
  pull_request: {}

env:
  UV_FROZEN: true

permissions: {}

jobs:
  test:
    name: test ${{ matrix.python-version }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - id: cache-rust
        name: cache rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2  # zizmor: ignore[cache-poisoning] -- test / lint job: read-only permissions, no release artifacts
        with:
          key: v3

      - name: set up python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      # openpyxl is the test oracle (a test dependency only); lxml and pandas
      # are optional for openpyxl and for the tests. lxml is left out on
      # free-threaded Python: it re-enables the GIL with a RuntimeWarning
      # (an error in openpyxl's test-suite); ElementTree is used instead.
      - name: install test dependencies
        run: |
          pip install pytest hypothesis "openpyxl==3.1.5" psutil
          optional="pillow numpy pandas"
          if python -c "import sys, sysconfig; sys.exit(1 if sysconfig.get_config_var('Py_GIL_DISABLED') else 0)"; then
            optional="lxml $optional"
          fi
          for pkg in $optional; do
            pip install --only-binary=:all: "$pkg" || echo "no $pkg wheel for this interpreter"
          done

      - run: pip install . -v
        env:
          RUST_BACKTRACE: 1

      - run: pip freeze

      - name: test-suite (differential tests against openpyxl)
        run: pytest -q

      - name: test-suite with the ElementTree XML backend
        run: pytest -q tests/test_reader_edge_cases.py tests/test_writer_edge_cases.py tests/test_extended.py tests/test_security.py
        env:
          OPENPYXL_LXML: "False"

      - name: Python fallbacks of the Rust engine
        run: pytest -q tests/test_extended.py tests/smoke
        env:
          OPENRSXL_PURE_PYTHON: "1"

      - name: openpyxl's own test-suite (ported)
        working-directory: tests/upstream
        run: |
          if python -c "import sys, sysconfig; sys.exit(0 if sysconfig.get_config_var('Py_GIL_DISABLED') else 1)"; then
            # its helpers need lxml, which would re-enable the GIL (with a
            # RuntimeWarning, an error here): keep it disabled, the suite is
            # single-threaded
            pip install --only-binary=:all: lxml
            python -X gil=0 -m pytest -q
          else
            python -m pytest -q
          fi

  test-pyemscripten:
    name: test ${{ matrix.python-version }} PyEmscripten
    needs: [build-pyemscripten]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.14"
            pylock-suffix: "314"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions

      - name: get dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openrsxl_pypi_files_pyemscripten_${{ matrix.python-version }}
          path: dist

      # the dependency-free smoke tests (the differential tests need openpyxl,
      # numpy, lxml... as test oracle)
      - run: |
          uv sync --only-group pyodide-build
          uv run pyodide venv .venv-pyodide
          source .venv-pyodide/bin/activate
          python -m pip install --upgrade pip>=26.1.1
          python -m pip install -r .github/pyodide/pylock.${{ matrix.pylock-suffix }}.toml
          python -m pip install et_xmlfile
          python -m pip install openrsxl --no-index --no-deps --find-links dist
          python -m pytest -q tests/smoke

  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - name: cache rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2  # zizmor: ignore[cache-poisoning] -- test / lint job: read-only permissions, no release artifacts

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0  # zizmor: ignore[cache-poisoning] -- test / lint job: read-only permissions, no release artifacts
        id: cache-py
        name: cache python
        with:
          path: ${{ env.pythonLocation }}
          key: >
            py
            ${{ env.pythonLocation }}

      - run: pip install pre-commit
        if: steps.cache-py.outputs.cache-hit != 'true'

      - run: pip freeze

      - run: pre-commit run --all-files --show-diff-on-failure

  # https://github.com/marketplace/actions/alls-green#why used for branch protection checks
  check:
    if: always()
    needs: [test, test-pyemscripten, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # The Pyodide toolchain breaks independently of this code; don't block releases on it.
          allowed-failures: test-pyemscripten
          allowed-skips: test-pyemscripten

  build:
    name: build on ${{ matrix.os }} (${{ matrix.target }} - ${{ matrix.interpreter || 'all' }}${{ matrix.os == 'linux' && format(' - {0}', matrix.manylinux == 'auto' && 'manylinux' || matrix.manylinux) || '' }})
    permissions:
      contents: read
    if: success()
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos, windows]
        target: [undefined]
        manylinux: [auto]
        include:
          # manylinux for various platforms
          - os: linux
            manylinux: auto
            target: x86_64
          - os: linux
            manylinux: auto
            target: aarch64
          - os: linux
            manylinux: auto
            target: i686
          - os: linux
            manylinux: auto
            target: armv7
          - os: linux
            manylinux: auto
            target: ppc64le
          - os: linux
            manylinux: auto
            target: s390x

          # musllinux
          - os: linux
            manylinux: musllinux_1_1
            target: x86_64
          - os: linux
            manylinux: musllinux_1_1
            target: aarch64
          - os: linux
            manylinux: musllinux_1_1
            target: armv7

          # macos
          - os: macos
            target: x86_64
          - os: macos
            target: aarch64

          # windows
          - os: windows
            target: x86_64
          - os: windows
            target: i686
            interpreter: 3.10 3.11 3.12 3.13 3.14
          - os: windows
            target: aarch64
            runs-on: windows-11-arm
            interpreter: 3.11 3.12 3.13 3.14 3.14t

        exclude:
          # was just a dummy variable to set a default value for target
          - target: undefined

    runs-on: ${{ matrix.runs-on || format('{0}-latest', (matrix.os == 'linux' && 'ubuntu') || matrix.os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: install rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - run: pip install -U twine

      - name: build sdist
        if: ${{ matrix.os == 'linux' && matrix.target == 'x86_64' && matrix.manylinux == 'auto' }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
          rust-toolchain: stable

      # CPython only: the Rust engine relies on CPython's object layout
      # (no PyPy / GraalPy wheels)
      - name: build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist --interpreter ${{ matrix.interpreter || '3.10 3.11 3.12 3.13 3.14 3.14t' }}
          rust-toolchain: stable

      - run: ${{ (matrix.os == 'windows' && 'dir') || 'ls -lh' }} dist/

      - run: twine check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openrsxl_pypi_files_${{ matrix.os }}_${{ matrix.target }}_${{ matrix.manylinux || 'auto' }}
          path: dist

  # Installs the built wheels on clean machines without Rust (--only-binary) and runs the tests.
  test-wheels:
    name: test wheel on ${{ matrix.runs-on }}
    needs: [build]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-latest # Linux x86_64
          - ubuntu-24.04-arm # Linux aarch64
          - macos-latest # macOS Apple Silicon
          - macos-15-intel # macOS Intel
          - windows-latest # Windows x64
          - windows-11-arm # Windows ARM64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: get dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: openrsxl_pypi_files_*
          merge-multiple: true

      - name: install the wheel (binary only, no Rust on this machine)
        shell: bash
        run: |
          pip install et_xmlfile  # the runtime dependency (from PyPI)
          pip install --only-binary :all: --no-index --find-links dist openrsxl
          pip install pytest hypothesis "openpyxl==3.1.5" psutil
          for pkg in lxml pillow numpy pandas; do
            pip install --only-binary=:all: "$pkg" || echo "no $pkg wheel for this platform"
          done

      - name: run tests against the installed wheel
        shell: bash
        run: |
          rm -rf python  # make sure the tests import the installed wheel, not the source tree
          python -c "import openrsxl, openrsxl._native as n; print(openrsxl.__file__, 'rust engine:', n.ENABLED)"
          python -m pytest -q tests
          if python -c "import lxml"; then
            cd tests/upstream && python -m pytest -q
          else
            echo "no lxml wheel on this platform: openpyxl's test-suite (its helpers need lxml) is skipped"
          fi

  build-pyemscripten:
    name: build PyEmscripten (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning]

      - run: uv sync --only-group pyodide-build

      - name: Get pyodide config
        id: pyodide-config
        run: |
          echo "rust-toolchain=$(uv run pyodide config get rust_toolchain)" >> "$GITHUB_OUTPUT"
          echo "emscripten-version=$(uv run pyodide config get emscripten_version)" >> "$GITHUB_OUTPUT"
          echo "pyodide-abi-version=$(uv run pyodide config get pyodide_abi_version)" >> "$GITHUB_OUTPUT"
          echo "rustflags=$(uv run pyodide config get rustflags)" >> "$GITHUB_OUTPUT"

      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ steps.pyodide-config.outputs.emscripten-version }}
          no-cache: ${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        # Unclear how to avoid manually specifying this yet (https://github.com/PyO3/maturin/issues/3189):
        env:
          CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUSTFLAGS: ${{ steps.pyodide-config.outputs.rustflags }}
          MATURIN_PYEMSCRIPTEN_PLATFORM_VERSION: ${{ steps.pyodide-config.outputs.pyodide-abi-version }}
        with:
          target: wasm32-unknown-emscripten
          args: --release --out dist --interpreter ${{ matrix.python-version }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning]
          rust-toolchain: ${{ steps.pyodide-config.outputs.rust-toolchain }}

      - run: ls -lh dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openrsxl_pypi_files_pyemscripten_${{ matrix.python-version }}
          path: dist

  release:
    needs: [build, check, test-wheels]
    if: success() && startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-latest

    environment:
      name: release
      url: https://pypi.org/p/openrsxl/

    permissions: {}

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: openrsxl_pypi_files_*
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false # attestations need trusted publishing; this uses an API token

  gh-release:
    needs: [build, check, test-wheels]
    if: success() && startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: openrsxl_pypi_files_*
          merge-multiple: true

      - name: Upload to GitHub
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*
